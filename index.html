    <script>
      // Entrance boot: hide the landing mosaic until the entrance choreography is ready.
      (function () {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var onLanding = location.pathname === '/' || location.pathname === '';
        if (!reduce && onLanding) {
          document.documentElement.classList.add('motion-pending');
          window.__entranceFailsafe = setTimeout(function () {
            document.documentElement.classList.remove('motion-pending');
          }, 2400);
        }
      })();
    </script>
